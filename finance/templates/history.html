{% extends "layout.html" %}
{% block title %}History{% endblock %}
{% block main %}
    <div class="card-terminal mx-auto" style="max-width: 900px;">
        <table class="table table-terminal">
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Shares</th>
                    <th>Price</th>
                    <th>Type</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                {% for t in transactions %}
                <tr>
                    <td>{{ t.symbol }}</td>
                    <td>{{ t.shares }}</td>
                    <td>{{ t.price | usd }}</td>
                    <td>
                        {% if t.type == "BUY" %}
                        <span class="badge-buy">BUY</span>
                        {% else %}
                        <span class="badge-sell">SELL</span>
                        {% endif %}
                    </td>
                    <td>{{ t.timestamp }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
